<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Communication Board</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 10px;
    background: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}


/* =========================================================
   TITLE
========================================================= */

h1 {
    font-size: clamp(30px, 6vw, 52px);
    margin: 5px 0 10px;
    font-weight: bold;
}


/* =========================================================
   MESSAGE DISPLAY
========================================================= */

#message {
    background: white;
    border: 5px solid #333;
    border-radius: 18px;
    min-height: 110px;
    padding: 15px;
    margin-bottom: 15px;
    font-size: clamp(32px, 7vw, 64px);
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-word;
    cursor: pointer;
    touch-action: manipulation;
}

#message:focus-visible {
    outline: 5px solid #1769aa;
    outline-offset: 3px;
}


/* =========================================================
   COMMUNICATION BUTTONS
========================================================= */

.button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}


button {
    border: 4px solid #222;
    border-radius: 18px;
    min-height: 95px;
    padding: 8px;
    font-size: clamp(25px, 5vw, 42px);
    font-weight: bold;
    cursor: pointer;

    /* "manipulation" removes the tap delay but still lets taps become clicks.
       (touch-action: none can interfere with iOS taps.) */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;

    box-shadow: 0 4px 0 #555;
    transition: transform 0.05s;
}


button:active,
button.pressed {
    transform: translateY(4px);
    box-shadow: none;
}

/* The picture and word inside a button never take the touch themselves,
   so a long press can't select text or open "Look Up" on the emoji. */
button * {
    pointer-events: none;
}

/* Large picture symbols with clear word labels */
.communication-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    line-height: 1.05;
}

.button-picture {
    display: block;
    font-size: clamp(38px, 7vw, 62px);
    line-height: 1;
}

.button-word {
    display: block;
    font-size: clamp(22px, 4vw, 36px);
}


/* =========================================================
   DIFFERENT BUTTON COLOURS
========================================================= */

.button-yes       { background: #8BE28B; }
.button-no        { background: #FF9999; }
.button-positive  { background: #FFD966; }
.button-condition { background: #C9B1FF; }
.button-body      { background: #FFB6C1; }
.button-needs     { background: #87CEEB; }
.button-help      { background: #FFB347; }
.button-other     { background: #B8E986; }


/* =========================================================
   KEYBOARD
========================================================= */

#keyboard {
    margin-top: 20px;
}

#keyboardTitle {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: bold;
    margin-bottom: 10px;
}

.keyboard-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.keyboard-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
}

.keyboard-row.middle-row {
    padding-left: 4%;
    padding-right: 4%;
}

.keyboard-row.bottom-row {
    padding-left: 8%;
    padding-right: 8%;
}

.letter {
    min-width: 0;
    min-height: 100px;
    padding: 4px;
    font-size: clamp(38px, 8vw, 72px);
    background: #FFFFFF;
    transform-origin: center;
}

.letter.pop {
    animation: letterPop 180ms ease-out;
}

@keyframes letterPop {
    0%   { transform: scale(1); background: #FFFFFF; }
    45%  { transform: scale(1.12); background: #FFF2A8; }
    100% { transform: scale(1); background: #FFFFFF; }
}

.keyboard-bottom-row {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-top: 10px;
    min-height: 90px;
}

.spacebar {
    width: 62%;
    min-height: 85px;
    font-size: clamp(25px, 5vw, 40px);
    background: #D0E0FF;
}

.keyboard-arrow {
    position: absolute;
    min-width: 100px;
    width: 19%;
    min-height: 85px;
    font-size: clamp(34px, 6vw, 54px);
    background: #D9D9D9;
}

.keyboard-arrow.arrow-left  { left: 0; }
.keyboard-arrow.arrow-right { right: 0; }

#message.pop-message {
    animation: messagePop 180ms ease-out;
}

@keyframes messagePop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.025); }
    100% { transform: scale(1); }
}


/* =========================================================
   KEYBOARD CONTROL BUTTONS
========================================================= */

.keyboard-controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.control {
    min-height: 90px;
    font-size: clamp(28px, 5vw, 44px);
}

.delete { background: #FF9999; }
.clear  { background: #FFCC80; }
.speak  { background: #8BE28B; }

.repeat {
    background: #C9B1FF;
    width: 100%;
    margin-top: 10px;
}


/* =========================================================
   PAGE BUTTONS
========================================================= */

.page-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.page-button {
    min-height: 80px;
    font-size: clamp(26px, 5vw, 40px);
    background: #D9D9D9;
}


/* =========================================================
   POPUP
========================================================= */

#popup {
    display: none;
    position: fixed;
    left: 5%;
    right: 5%;
    top: 25%;
    background: white;
    border: 6px solid #222;
    border-radius: 20px;
    padding: 25px;
    font-size: clamp(35px, 7vw, 65px);
    font-weight: bold;
    z-index: 9999;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

#popupClose {
    margin-top: 20px;
    min-height: 80px;
    font-size: 32px;
    background: #DDD;
}


/* =========================================================
   TABLETS / LARGE SCREENS
========================================================= */

@media (min-width: 700px) {

    body {
        padding: 20px;
    }

    .button-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .letter {
        min-height: 130px;
    }

}

</style>

</head>


<body>


<h1>Communication</h1>


<!-- COMMUNICATION BUTTONS -->

<div class="button-grid" id="communicationButtons"></div>


<!-- MESSAGE DISPLAY -->

<div id="message" role="button" tabindex="0"
     aria-label="Tap to hear the message">

    Tap a button or type a message

</div>


<!-- KEYBOARD -->

<div id="keyboard">

    <div id="keyboardTitle">KEYBOARD A–M</div>

    <div class="keyboard-grid" id="letters"></div>

    <div class="keyboard-bottom-row">

        <button
            class="keyboard-arrow arrow-right"
            id="keyboardArrow"
            onclick="changeKeyboard()"
            aria-label="Next half of keyboard">
            ▶
        </button>

        <button class="spacebar" onclick="addSpace()">
            SPACE
        </button>

    </div>

    <div class="keyboard-controls">

        <button class="control delete" onclick="deleteLetter()">
            DELETE
        </button>

        <button class="control clear" onclick="clearMessage()">
            CLEAR
        </button>

        <button class="control speak" onclick="speakMessage()">
            🔊 SPEAK
        </button>

    </div>

    <button class="control repeat" onclick="repeatMessage()">
        🔊 REPEAT MESSAGE
    </button>

</div>


<!-- POPUP -->

<div id="popup">

    <div id="popupText"></div>

    <button id="popupClose" onclick="closePopup()">
        CLOSE
    </button>

</div>



<script>


/* =========================================================
   =========================================================

   ⭐⭐ EASY EDIT SECTION ⭐⭐

   THIS IS THE MAIN PART YOU WILL EDIT.

   "text"    = what appears on the button
   "picture" = the symbol on the button
   "speech"  = what the device says
   "colour"  = colour of the button

   =========================================================
   ========================================================= */

const communicationButtons = [

    /* YES */
    {
        text: "WA",
        picture: "👍",

    },

    /* NO */

    },

    },

    {

    },

    {

        speech: "Tired",
        colour: "button-condition"
    },

    {

        picture: "👌",

        colour: "button-positive"
    },

    {
        text: "PAIN",
        picture: "🤕",
        speech: "Pain",
        colour: "button-body"
    },

    {
        text: "ITCHY",
        picture: "🩹",
        speech: "Itchy",
        colour: "button-body"
    },

    {
        text: "COLD",
        picture: "🥶",
        speech: "Cold",
        colour: "button-body"
    },

    {
        text: "HOT",
        picture: "🥵",
        speech: "Hot",
        colour: "button-body"
    },

    {
        text: "HUNGRY",
        picture: "🍽️",
        speech: "Hungry",
        colour: "button-needs"
    },

    {
        text: "WATER",
        picture: "💧",
        speech: "Water",
        colour: "button-needs"
    },

    {
        text: "TOILET",
        picture: "🚽",
        speech: "Toilet",
        colour: "button-needs"
    },

    {
        text: "MEDICINE",
        picture: "💊",
        speech: "Medicine",
        colour: "button-needs"
    },

    {
        text: "HELP ME",
        picture: "🆘",
        speech: "Help me",
        colour: "button-help"
    },

    {
        text: "MORE",
        picture: "➕",
        speech: "More",
        colour: "button-other"
    },

    {
        text: "STOP",
        picture: "✋",
        speech: "Stop",
        colour: "button-no"
    },


    /* =====================================================
       YOUR NEW BUTTONS
    ===================================================== */

    {
        text: "ASU",
        picture: "🐕",
        speech: "ahsoo",
        colour: "button-no"
    },

    {
        text: "PUSA",
        picture: "🐈",
        speech: "poosah",
        colour: "button-positive"
    },

    {
        text: "DIAPER",
        picture: "🧷",
        speech: "diaper",
        colour: "button-condition"
    },

    {
        text: "NILAGA",
        picture: "🍲",
        speech: "nihlagah",
        colour: "button-body"
    },

    {
        text: "INASAL",
        picture: "🍗",
        speech: "inahsal",
        colour: "button-needs"
    },

    {
        text: "ADOBO",
        picture: "🥘",
        speech: "ahhdohboh",
        colour: "button-help"
    },

    {
        text: "MORE2",
        picture: "➕",
        speech: "more",
        colour: "button-no"
    },

    {
        text: "MORE3",
        picture: "➕",
        speech: "more",
        colour: "button-no"
    }

];


/*
   How each letter is spoken when its key is pressed.
   Spelling the letter name out (e.g. "ay", "bee") is more reliable
   than sending a single letter, which some voices read as a word
   ("a" as "uh") or as "capital A".
*/
const letterSounds = {
    A: "ay",   B: "bee",  C: "see",  D: "dee",  E: "ee",
    F: "eff",  G: "jee",  H: "aitch", I: "eye", J: "jay",
    K: "kay",  L: "ell",  M: "em",   N: "en",   O: "oh",
    P: "pee",  Q: "cue",  R: "ar",   S: "ess",  T: "tee",
    U: "you",  V: "vee",  W: "double you", X: "ex", Y: "why",
    Z: "zed"
};


/* =========================================================
   END OF EASY EDIT SECTION
   ========================================================= */


/* =========================================================
   VARIABLES
========================================================= */

let messageText = "";
let messageSpeech = "";

let lastSpoken = "";

let keyboardPage = 0;

let selectedVoice = null;

let audioContext = null;

// Keep a reference to the current utterance. Some browsers garbage-collect
// an utterance mid-speech, which makes it go silent.
let currentUtterance = null;

let speakTimer = null;


/* =========================================================
   KEYBOARD LETTERS
========================================================= */

const keyboardPages = [

    // Left half of a normal QWERTY keyboard
    [
        ["Q", "W", "E", "R", "T"],
        ["A", "S", "D", "F", "G"],
        ["Z", "X", "C", "V", "B"]
    ],

    // Right half of a normal QWERTY keyboard
    [
        ["Y", "U", "I", "O", "P"],
        ["H", "J", "K", "L", "N"],
        ["M"]
    ]

];



/* =========================================================
   CREATE COMMUNICATION BUTTONS
========================================================= */

function createCommunicationButtons() {

    const container = document.getElementById("communicationButtons");

    container.innerHTML = "";

    communicationButtons.forEach(function(item) {

        const button = document.createElement("button");

        button.className = "communication-button " + item.colour;

        const picture = document.createElement("span");
        picture.className = "button-picture";
        picture.textContent = item.picture || "💬";

        const word = document.createElement("span");
        word.className = "button-word";
        word.textContent = item.text;

        button.appendChild(picture);
        button.appendChild(word);

        button.onclick = function() {

            clickSound();

            // Display the word exactly as defined in "text".
            messageText = item.text;
            messageSpeech = item.speech;

            updateMessage();

            // Speak the separate pronunciation defined in "speech".
            speak(item.speech);

        };

        container.appendChild(button);

    });

}



/* =========================================================
   VOICE SELECTION
========================================================= */

function loadVoices() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const voices = speechSynthesis.getVoices();

    if (!voices || voices.length === 0) {
        return;
    }

    // Look for English voices.
    const englishVoices = voices.filter(function(voice) {
        return voice.lang &&
            voice.lang.toLowerCase().startsWith("en");
    });

    // Try common female voices first. Names differ between devices.
    const femaleNames = [
        "samantha",
        "karen",
        "moira",
        "victoria",
        "susan",
        "serena",
        "kate",
        "female",
        "google uk english female",
        "google us english female"
    ];

    selectedVoice = englishVoices.find(function(voice) {

        const name = voice.name.toLowerCase();

        return femaleNames.some(function(femaleName) {
            return name.includes(femaleName);
        });

    });

    // If no obvious female voice is found, prefer British English.
    if (!selectedVoice) {

        selectedVoice = englishVoices.find(function(voice) {
            return voice.lang.toLowerCase().replace("_", "-") === "en-gb";
        });

    }

    // Final fallback.
    if (!selectedVoice) {
        selectedVoice = englishVoices[0] || null;
    }

}


if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}



/* =========================================================
   UNLOCK AUDIO (iPad / iPhone)

   iOS only allows sound after a real tap has finished
   (touchend / click). The first tap anywhere on the page
   "unlocks" both the click sound and speech, so every
   later button works.
========================================================= */

let audioUnlocked = false;

function unlockAudio() {

    if (audioUnlocked) {
        return;
    }

    try {

        // Unlock Web Audio
        if (!audioContext) {
            audioContext = new (
                window.AudioContext || window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        // Play one silent sample to fully wake the audio system
        const buffer = audioContext.createBuffer(1, 1, 22050);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);

    } catch (error) {
        // Sound not supported: carry on silently.
    }

    try {

        // Unlock speech with a silent utterance
        if ("speechSynthesis" in window) {

            const silent = new SpeechSynthesisUtterance(" ");
            silent.volume = 0;
            speechSynthesis.speak(silent);

        }

    } catch (error) {
        // Ignore
    }

    audioUnlocked = true;

}

// Listen on the events iOS accepts as a real user gesture.
["touchend", "click", "keydown"].forEach(function(type) {
    document.addEventListener(type, unlockAudio, { capture: true });
});



/* =========================================================
   CLICK SOUND
========================================================= */

function clickSound() {

    try {

        if (!audioContext) {
            audioContext = new (
                window.AudioContext || window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 600;

        gain.gain.setValueAtTime(0.12, audioContext.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.06
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.06);

    } catch (error) {

        // If sound isn't supported, simply continue normally.

    }

}



/* =========================================================
   SPEAK
========================================================= */

function speak(text) {

    if (!text || text.trim() === "") {
        return;
    }

    if (!("speechSynthesis" in window)) {
        return;
    }

    // Refresh voices because iPad Safari may load them after the page opens.
    if (!selectedVoice) {
        loadVoices();
    }

    const utterance = new SpeechSynthesisUtterance(text);

    // The actual word being spoken is controlled by the "speech" field.
    utterance.lang = "en-GB";

    if (selectedVoice) {
        utterance.voice = selectedVoice;
    }

    // 0.7 = slower, 0.8 = slow, 1.0 = normal
    utterance.rate = 0.82;

    // Slightly higher pitch.
    utterance.pitch = 1.05;

    utterance.volume = 1;

    currentUtterance = utterance;

    clearTimeout(speakTimer);

    // iOS can drop the next phrase if it is spoken the instant after
    // cancel(), so wait a moment when something is still being said.
    if (speechSynthesis.speaking || speechSynthesis.pending) {

        speechSynthesis.cancel();

        speakTimer = setTimeout(function() {
            speechSynthesis.speak(utterance);
        }, 60);

    } else {

        if (speechSynthesis.paused) {
            speechSynthesis.resume();
        }

        speechSynthesis.speak(utterance);

    }

    lastSpoken = text;

}



/* =========================================================
   MESSAGE DISPLAY
========================================================= */

function updateMessage() {

    const message = document.getElementById("message");

    if (messageText) {
        message.textContent = messageText;
    } else {
        message.textContent = "Tap a button or type a message";
    }

    message.classList.remove("pop-message");
    void message.offsetWidth;
    message.classList.add("pop-message");

}


// Tap or press Enter/Space on the message area to hear the whole message.
const messageDisplay = document.getElementById("message");

messageDisplay.addEventListener("click", function() {

    clickSound();

    const textToSpeak = messageSpeech || messageText;

    if (textToSpeak.trim()) {
        speak(textToSpeak);
    }

});

messageDisplay.addEventListener("keydown", function(event) {

    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.stopPropagation();
        messageDisplay.click();
    }

});


/* =========================================================
   KEYBOARD DISPLAY
========================================================= */

function displayKeyboard() {

    const letters = document.getElementById("letters");
    const title = document.getElementById("keyboardTitle");
    const arrow = document.getElementById("keyboardArrow");

    letters.innerHTML = "";

    const page = keyboardPages[keyboardPage];

    title.textContent =
        keyboardPage === 0
            ? "KEYBOARD – LEFT HALF"
            : "KEYBOARD – RIGHT HALF";

    page.forEach(function(rowLetters, rowIndex) {

        const row = document.createElement("div");

        row.className =
            "keyboard-row" +
            (rowIndex === 1 ? " middle-row" : "") +
            (rowIndex === 2 ? " bottom-row" : "");

        rowLetters.forEach(function(letter) {

            const button = document.createElement("button");

            button.className = "letter";
            button.textContent = letter;
            button.setAttribute("aria-label", "Letter " + letter);

            button.onclick = function() {

                clickSound();

                button.classList.remove("pop");
                void button.offsetWidth;
                button.classList.add("pop");

                addLetter(letter);
            };

            row.appendChild(button);

        });

        letters.appendChild(row);

    });

    if (keyboardPage === 0) {

        arrow.textContent = "▶";
        arrow.className = "keyboard-arrow arrow-right";
        arrow.setAttribute("aria-label", "Show right half of keyboard");

    } else {

        arrow.textContent = "◀";
        arrow.className = "keyboard-arrow arrow-left";
        arrow.setAttribute("aria-label", "Show left half of keyboard");

    }

}


function changeKeyboard() {

    clickSound();

    keyboardPage = keyboardPage === 0 ? 1 : 0;

    displayKeyboard();

}


/* =========================================================
   ADD LETTER
========================================================= */

function addLetter(letter) {

    messageText += letter;
    messageSpeech = messageText;

    updateMessage();

    // Say the letter's name (e.g. "bee") rather than the raw letter.
    // Don't let it overwrite "lastSpoken", so REPEAT still repeats
    // the last whole word or message.
    const previousLastSpoken = lastSpoken;
    speak(letterSounds[letter.toUpperCase()] || letter.toLowerCase());
    lastSpoken = previousLastSpoken;

}



/* =========================================================
   SPACE
========================================================= */

function addSpace() {

    clickSound();

    messageText += " ";
    messageSpeech = messageText;

    updateMessage();

}



/* =========================================================
   DELETE
========================================================= */

function deleteLetter() {

    clickSound();

    messageText = messageText.slice(0, -1);
    messageSpeech = messageText;

    updateMessage();

}



/* =========================================================
   CLEAR
========================================================= */

function clearMessage() {

    clickSound();

    messageText = "";
    messageSpeech = "";

    updateMessage();

}



/* =========================================================
   SPEAK MESSAGE
========================================================= */

function speakMessage() {

    clickSound();

    if (!messageText.trim()) {
        return;
    }

    speak(messageSpeech || messageText);

}



/* =========================================================
   REPEAT MESSAGE
========================================================= */

function repeatMessage() {

    clickSound();

    if (lastSpoken) {
        speak(lastSpoken);
    }

}



/* =========================================================
   POPUP
========================================================= */

function showPopup() {

    if (!messageText.trim()) {
        return;
    }

    clickSound();

    document.getElementById("popupText").textContent = messageText;

    document.getElementById("popup").style.display = "block";

}


function closePopup() {

    clickSound();

    document.getElementById("popup").style.display = "none";

}



/* =========================================================
   PHYSICAL KEYBOARD
========================================================= */

document.addEventListener("keydown", function(event) {

    const key = event.key;

    // If a button or the message box has focus, Enter/Space already
    // activate it natively, so don't act on them a second time here.
    const onControl =
        event.target &&
        event.target.closest &&
        event.target.closest("button, #message");

    if (/^[a-zA-Z]$/.test(key)) {

        if (event.metaKey || event.ctrlKey || event.altKey) {
            return;
        }

        addLetter(key.toUpperCase());
        return;

    }

    if (onControl && (key === " " || key === "Enter")) {
        return;
    }

    if (key === " ") {

        event.preventDefault();
        addSpace();
        return;

    }

    if (key === "Backspace") {

        deleteLetter();
        return;

    }

    if (key === "Escape") {

        clearMessage();
        return;

    }

    if (key === "Enter") {

        speakMessage();
        return;

    }

});



/* =========================================================
   START
========================================================= */

createCommunicationButtons();

displayKeyboard();

updateMessage();


/* =========================================================
   FORGIVING TOUCH HANDLING

   A normal browser click only happens if the finger is lifted
   quickly and stays perfectly still. Here, a touch counts as a
   press when the finger is lifted, however long it was held,
   and even if the finger wandered a little.

   ⭐ SETTINGS YOU CAN CHANGE ⭐
========================================================= */

// How far (in pixels) the finger may drift and still count as a press.
// Bigger = more forgiving. Moving further than this is treated as a scroll.
const TOUCH_DRIFT_LIMIT = 80;

// After a button is pressed, the same button ignores further presses for
// this many milliseconds. Stops tremor or a slow lift causing repeats.
// Set to 0 to turn off.
const SAME_BUTTON_LOCKOUT_MS = 350;


(function forgivingTouch() {

    let activeTouchId = null;
    let activeControl = null;
    let startX = 0;
    let startY = 0;
    let startScroll = 0;
    let cancelled = false;

    let lastControl = null;
    let lastTime = 0;

    function findControl(target) {
        if (!target || !target.closest) return null;
        const control = target.closest("button, #message");
        if (!control || control.disabled) return null;
        return control;
    }

    function reset() {
        if (activeControl) activeControl.classList.remove("pressed");
        activeTouchId = null;
        activeControl = null;
        cancelled = false;
    }

    function findTouch(list, id) {
        for (let i = 0; i < list.length; i++) {
            if (list[i].identifier === id) return list[i];
        }
        return null;
    }

    document.addEventListener("touchstart", function(event) {

        // Follow only the first finger; ignore a resting palm or knuckle.
        if (activeTouchId !== null) return;

        const touch = event.changedTouches[0];
        const control = findControl(touch.target);
        if (!control) return;

        activeTouchId = touch.identifier;
        activeControl = control;
        startX = touch.clientX;
        startY = touch.clientY;
        startScroll = window.pageYOffset;
        cancelled = false;

        // Show the button as pressed straight away.
        control.classList.add("pressed");

    }, { capture: true, passive: true });

    document.addEventListener("touchmove", function(event) {

        if (activeTouchId === null) return;

        const touch = findTouch(event.changedTouches, activeTouchId);
        if (!touch) return;

        const moved = Math.hypot(
            touch.clientX - startX,
            touch.clientY - startY
        );

        // Only give up if the finger really travelled (a deliberate swipe).
        if (moved > TOUCH_DRIFT_LIMIT) {
            cancelled = true;
            activeControl.classList.remove("pressed");
        }

    }, { capture: true, passive: true });

    document.addEventListener("touchend", function(event) {

        if (activeTouchId === null) return;

        const touch = findTouch(event.changedTouches, activeTouchId);
        if (!touch) return;

        const control = activeControl;

        const scrolled =
            Math.abs(window.pageYOffset - startScroll) > 5;

        const wasCancelled = cancelled || scrolled;

        reset();

        if (wasCancelled || !control) return;

        // Stop the browser also sending its own click afterwards.
        if (event.cancelable) event.preventDefault();

        // Make sure audio is unlocked before we play anything.
        unlockAudio();

        const now = Date.now();

        if (
            SAME_BUTTON_LOCKOUT_MS > 0 &&
            control === lastControl &&
            now - lastTime < SAME_BUTTON_LOCKOUT_MS
        ) {
            return;
        }

        lastControl = control;
        lastTime = now;

        // Run the button's normal action. The press was started on this
        // button, so it counts even if the finger slid off it slightly.
        control.click();

    }, { capture: true, passive: false });

    document.addEventListener("touchcancel", function() {
        reset();
    }, { capture: true, passive: true });

    // Stop the long-press menu that iOS/Android can show on a held button.
    document.addEventListener("contextmenu", function(event) {
        if (findControl(event.target)) event.preventDefault();
    }, true);

})();


</script>
