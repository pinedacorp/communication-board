<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Communication Board</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 10px;

    background: #eeeeee;

    font-family: Arial, Helvetica, sans-serif;

    text-align: center;

    user-select: none;
}


/* =========================================================
   TITLE
========================================================= */

h1 {
    font-size: clamp(30px, 6vw, 52px);

    margin: 5px 0 10px;

    font-weight: bold;
}


/* =========================================================
   MESSAGE DISPLAY
========================================================= */

#message {

    background: white;

    border: 5px solid #333;

    border-radius: 18px;

    min-height: 110px;

    padding: 15px;

    margin-bottom: 15px;

    font-size: clamp(32px, 7vw, 64px);

    font-weight: bold;

    display: flex;

    align-items: center;

    justify-content: center;

    word-break: break-word;
}


/* =========================================================
   COMMUNICATION BUTTONS
========================================================= */

.button-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-bottom: 15px;
}


button {

    border: 4px solid #222;

    border-radius: 18px;

    min-height: 95px;

    padding: 8px;

    font-size:
        clamp(25px, 5vw, 42px);

    font-weight: bold;

    cursor: pointer;

    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;

    /* A little extra breathing room makes the whole button easier to hit. */
    box-shadow:
        0 4px 0 #555;

    transition:
        transform 0.05s;
}


button:active {

    transform:
        translateY(4px);

    box-shadow: none;
}

/* Large picture symbols with clear word labels */
.communication-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    line-height: 1.05;
}

.button-picture {
    display: block;
    font-size: clamp(38px, 7vw, 62px);
    line-height: 1;
}

.button-word {
    display: block;
    font-size: clamp(22px, 4vw, 36px);
}

#message { cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
#message:focus-visible { outline: 5px solid #1769aa; outline-offset: 3px; }


/* =========================================================
   DIFFERENT BUTTON COLOURS
========================================================= */

.button-yes {
    background: #8BE28B;
}

.button-no {
    background: #FF9999;
}

.button-positive {
    background: #FFD966;
}

.button-condition {
    background: #C9B1FF;
}

.button-body {
    background: #FFB6C1;
}

.button-needs {
    background: #87CEEB;
}

.button-help {
    background: #FFB347;
}

.button-other {
    background: #B8E986;
}


/* =========================================================
   KEYBOARD
========================================================= */

#keyboard {

    margin-top: 20px;
}


#keyboardTitle {

    font-size:
        clamp(28px, 5vw, 42px);

    font-weight: bold;

    margin-bottom: 10px;
}


.keyboard-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.keyboard-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
}

.keyboard-row.middle-row {
    padding-left: 4%;
    padding-right: 4%;
}

.keyboard-row.bottom-row {
    padding-left: 8%;
    padding-right: 8%;
}

.letter {
    min-width: 0;
    min-height: 100px;
    padding: 4px;
    font-size: clamp(38px, 8vw, 72px);
    background: #FFFFFF;
    transform-origin: center;
}

.letter.pop {
    animation: letterPop 180ms ease-out;
}

@keyframes letterPop {
    0% { transform: scale(1); background: #FFFFFF; }
    45% { transform: scale(1.12); background: #FFF2A8; }
    100% { transform: scale(1); background: #FFFFFF; }
}

.keyboard-bottom-row {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-top: 10px;
    min-height: 90px;
}

.spacebar {
    width: 62%;
    min-height: 85px;
    font-size: clamp(25px, 5vw, 40px);
    background: #D0E0FF;
}

.keyboard-arrow {
    position: absolute;
    min-width: 100px;
    width: 19%;
    min-height: 85px;
    font-size: clamp(34px, 6vw, 54px);
    background: #D9D9D9;
}

.keyboard-arrow.arrow-left { left: 0; }
.keyboard-arrow.arrow-right { right: 0; }

#message.pop-message {
    animation: messagePop 180ms ease-out;
}

@keyframes messagePop {
    0% { transform: scale(1); }
    45% { transform: scale(1.025); }
    100% { transform: scale(1); }
}


/* =========================================================
   KEYBOARD CONTROL BUTTONS
========================================================= */

.keyboard-controls {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 10px;
}


.control {

    min-height: 90px;

    font-size:
        clamp(28px, 5vw, 44px);
}


.delete {

    background: #FF9999;
}


.clear {

    background: #FFCC80;
}


.speak {

    background: #8BE28B;
}


.repeat {

    background: #C9B1FF;

    width: 100%;

    margin-top: 10px;
}


/* =========================================================
   PAGE BUTTONS
========================================================= */

.page-controls {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 10px;
}


.page-button {

    min-height: 80px;

    font-size:
        clamp(26px, 5vw, 40px);

    background: #D9D9D9;
}


/* =========================================================
   POPUP
========================================================= */

#popup {

    display: none;

    position: fixed;

    left: 5%;

    right: 5%;

    top: 25%;

    background: white;

    border: 6px solid #222;

    border-radius: 20px;

    padding: 25px;

    font-size:
        clamp(35px, 7vw, 65px);

    font-weight: bold;

    z-index: 9999;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.4);
}


#popupClose {

    margin-top: 20px;

    min-height: 80px;

    font-size: 32px;

    background: #DDD;
}


/* =========================================================
   TABLETS / LARGE SCREENS
========================================================= */

@media (min-width: 700px) {

    body {
        padding: 20px;
    }


    .button-grid {

        grid-template-columns:
            repeat(4, 1fr);
    }


    .keyboard-grid {

        grid-template-columns:
            repeat(4, 1fr);
    }


    .letter {

        min-height: 130px;
    }

}

</style>

</head>


<body>


<h1>Communication</h1>


<!-- =====================================================
     COMMUNICATION BUTTONS
====================================================== -->

<div
    class="button-grid"
    id="communicationButtons">
</div>


<!-- =====================================================
     MESSAGE DISPLAY
====================================================== -->

<div id="message" role="button" tabindex="0"
     aria-label="Tap to hear the message">

    Tap a button or type a message

</div>


<!-- =====================================================
     KEYBOARD
====================================================== -->

<div id="keyboard">

    <div id="keyboardTitle">
        KEYBOARD A–M
    </div>


    <div
        class="keyboard-grid"
        id="letters">
    </div>


    <div class="keyboard-bottom-row">

        <button
            class="keyboard-arrow arrow-right"
            id="keyboardArrow"
            onclick="changeKeyboard()"
            aria-label="Next half of keyboard">

            ▶

        </button>

        <button
            class="spacebar"
            onclick="addSpace()">

            SPACE

        </button>

    </div>


    <div class="keyboard-controls">

        <button
            class="control delete"
            onclick="deleteLetter()">

            DELETE

        </button>


        <button
            class="control clear"
            onclick="clearMessage()">

            CLEAR

        </button>


        <button
            class="control speak"
            onclick="speakMessage()">

            🔊 SPEAK

        </button>

    </div>


    <button
        class="control repeat"
        onclick="repeatMessage()">

        🔊 REPEAT MESSAGE

    </button>


</div>


<!-- =====================================================
     POPUP
====================================================== -->

<div id="popup">

    <div id="popupText"></div>


    <button
        id="popupClose"
        onclick="closePopup()">

        CLOSE

    </button>

</div>



<script>


/* =========================================================
   =========================================================

   ⭐⭐ EASY EDIT SECTION ⭐⭐

   THIS IS THE MAIN PART YOU WILL EDIT.

   "text"  = what appears on the button

   "speech" = what the device says

   "colour" = colour of the button

   =========================================================
   ========================================================= */

const communicationButtons = [

    {

    },

    {

        picture: "🍽️",
        speech: "Hungry",
        colour: "button-needs"
    },

    {
        text: "WATER",
        picture: "💧",
        speech: "Water",
        colour: "button-needs"
    },

    {
        text: "TOILET",
        picture: "🚽",

    },

    {

    },

    {

    },

    {

        speech: "poosah",
        colour: "button-positive"
    },

    {
        text: "DIAPER",
        picture: "🧷",
        speech: "diaper",
        colour: "button-condition"
    },

    {
        text: "NILAGA",
        picture: "🍲",
        speech: "nihlagah",
        colour: "button-body"
    },

    {
        text: "INASAL",
        picture: "🍗",
        speech: "inahsal",
        colour: "button-needs"
    },

    {
        text: "ADOBO",
        picture: "🥘",
        speech: "ahhdohboh",
        colour: "button-help"
    },

    {
        text: "MORE2",
        picture: "➕",
        speech: "more",
        colour: "button-no"
    },

    {
        text: "MORE3",
        picture: "➕",
        speech: "more",
        colour: "button-no"
    }

];



/* =========================================================
   END OF EASY EDIT SECTION
   ========================================================= */


/* =========================================================
   VARIABLES
========================================================= */

let messageText = "";
let messageSpeech = "";

let lastSpoken = "";

let keyboardPage = 0;

let selectedVoice = null;

let audioContext = null;



/* =========================================================
   KEYBOARD LETTERS
========================================================= */

const keyboardPages = [

    // Left half of a normal QWERTY keyboard
    [
        ["Q", "W", "E", "R", "T"],
        ["A", "S", "D", "F", "G"],
        ["Z", "X", "C", "V", "B"]
    ],

    // Right half of a normal QWERTY keyboard
    [
        ["Y", "U", "I", "O", "P"],
        ["H", "J", "K", "L", "N"],
        ["M"]
    ]

];



/* =========================================================
   CREATE COMMUNICATION BUTTONS
========================================================= */

function createCommunicationButtons() {

    const container =
        document.getElementById(
            "communicationButtons"
        );


    container.innerHTML = "";


    communicationButtons.forEach(
        function(item) {

            const button =
                document.createElement("button");


            button.className =
                "communication-button " + item.colour;

            const picture = document.createElement("span");
            picture.className = "button-picture";
            picture.textContent = item.picture || "💬";

            const word = document.createElement("span");
            word.className = "button-word";
            word.textContent = item.text;

            button.appendChild(picture);
            button.appendChild(word);


            button.onclick =
                function() {

                    clickSound();

                    /*
                       Display the word exactly as
                       defined in "text".
                    */

                    messageText =
                        item.text;
                    messageSpeech = item.speech;

                    updateMessage();


                    /*
                       Speak the separate
                       pronunciation defined
                       in "speech".
                    */

                    speak(item.speech);

                };


            container.appendChild(button);

        }
    );

}



/* =========================================================
   VOICE SELECTION
========================================================= */

function loadVoices() {

    const voices =
        speechSynthesis.getVoices();


    if (!voices ||
        voices.length === 0) {

        return;
    }


    /*
       Look for English voices.
    */

    const englishVoices =
        voices.filter(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("en")
        );


    /*
       Try common female voices first.

       Different devices have different
       voice names.
    */

    const femaleNames = [

        "samantha",
        "karen",
        "moira",
        "victoria",
        "susan",
        "serena",
        "kate",
        "female",
        "google uk english female",
        "google us english female"

    ];


    selectedVoice =
        englishVoices.find(
            function(voice) {

                const name =
                    voice.name.toLowerCase();


                return femaleNames.some(
                    function(femaleName) {

                        return name.includes(
                            femaleName
                        );

                    }
                );

            }
        );


    /*
       If no obvious female voice is found,
       prefer British English.
    */

    if (!selectedVoice) {

        selectedVoice =
            englishVoices.find(
                voice =>
                    voice.lang
                        .toLowerCase() ===
                    "en-gb"
            );

    }


    /*
       Final fallback.
    */

    if (!selectedVoice) {

        selectedVoice =
            englishVoices[0] || null;

    }

}


speechSynthesis.onvoiceschanged =
    loadVoices;


loadVoices();



/* =========================================================
   CLICK SOUND
========================================================= */

function clickSound() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        const oscillator =
            audioContext
                .createOscillator();


        const gain =
            audioContext
                .createGain();


        oscillator.type = "sine";


        oscillator.frequency.value =
            600;


        gain.gain.setValueAtTime(
            0.12,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.06
        );


        oscillator.connect(gain);


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.06
        );


    } catch (error) {

        /*
           If sound isn't supported,
           simply continue normally.
        */

    }

}



/* =========================================================
   SPEAK
========================================================= */

function speak(text) {

    if (!text ||
        text.trim() === "") {

        return;
    }


    // Refresh voices because iPad Safari may load them after the page opens.
    if (!selectedVoice && typeof loadVoices === "function") {
        loadVoices();
    }

    // Stop the previous phrase so a new selection is spoken clearly.
    // Do not call cancel() when there is nothing queued: iOS Safari can
    // occasionally silence the next utterance after an unnecessary cancel.
    if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
    }

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
       English is used for the browser voice.

       The actual word being spoken is
       controlled by the "speech" field
       above.
    */

    utterance.lang = "en-GB";


    if (selectedVoice) {

        utterance.voice =
            selectedVoice;

    }


    /*
       Slightly slower than normal.

       This can be changed if required:

       0.7 = slower
       0.8 = slow
       1.0 = normal
    */

    utterance.rate = 0.82;


    /*
       Slightly higher pitch.
    */

    utterance.pitch = 1.05;


    utterance.volume = 1;


    speechSynthesis.speak(
        utterance
    );


    lastSpoken = text;

}



/* =========================================================
   MESSAGE DISPLAY
========================================================= */

function updateMessage() {

    const message =
        document.getElementById(
            "message"
        );


    if (messageText) {

        message.textContent =
            messageText;

    } else {

        message.textContent =
            "Tap a button or type a message";

    }

    message.classList.remove("pop-message");
    void message.offsetWidth;
    message.classList.add("pop-message");

}


// Tap or press Enter/Space on the message area to hear the whole message.
const messageDisplay = document.getElementById("message");
messageDisplay.addEventListener("click", function() {
    clickSound();
    const textToSpeak = messageSpeech || messageText;
    if (textToSpeak.trim()) speak(textToSpeak);
});
messageDisplay.addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        messageDisplay.click();
    }
});


/* =========================================================
   KEYBOARD DISPLAY
========================================================= */

function displayKeyboard() {

    const letters = document.getElementById("letters");
    const title = document.getElementById("keyboardTitle");
    const arrow = document.getElementById("keyboardArrow");

    letters.innerHTML = "";

    const page = keyboardPages[keyboardPage];

    title.textContent =
        keyboardPage === 0
            ? "KEYBOARD – LEFT HALF"
            : "KEYBOARD – RIGHT HALF";

    page.forEach(function(rowLetters, rowIndex) {

        const row = document.createElement("div");

        row.className =
            "keyboard-row" +
            (rowIndex === 1 ? " middle-row" : "") +
            (rowIndex === 2 ? " bottom-row" : "");

        rowLetters.forEach(function(letter) {

            const button = document.createElement("button");

            button.className = "letter";
            button.textContent = letter;
            button.setAttribute("aria-label", "Letter " + letter);

            button.onclick = function() {

                clickSound();

                button.classList.remove("pop");
                void button.offsetWidth;
                button.classList.add("pop");

                addLetter(letter);
            };

            row.appendChild(button);

        });

        letters.appendChild(row);

    });

    if (keyboardPage === 0) {

        arrow.textContent = "▶";
        arrow.className = "keyboard-arrow arrow-right";
        arrow.setAttribute("aria-label", "Show right half of keyboard");

    } else {

        arrow.textContent = "◀";
        arrow.className = "keyboard-arrow arrow-left";
        arrow.setAttribute("aria-label", "Show left half of keyboard");

    }

}


function changeKeyboard() {

    clickSound();

    keyboardPage = keyboardPage === 0 ? 1 : 0;

    displayKeyboard();

}


/* =========================================================
   ADD LETTER
========================================================= */

function addLetter(letter) {

    messageText += letter;
    messageSpeech = messageText;

    updateMessage();

    // Speak only the letter name, not the word "capital".
    // Lowercase text helps some browser voices avoid saying "capital A".
    const previousLastSpoken = lastSpoken;
    speak(letter.toLowerCase());
    lastSpoken = previousLastSpoken;

}



/* =========================================================
   SPACE
========================================================= */

function addSpace() {

    clickSound();

    messageText += " ";
    messageSpeech = messageText;

    updateMessage();

}



/* =========================================================
   DELETE
========================================================= */

function deleteLetter() {

    clickSound();

    messageText =
        messageText.slice(0, -1);
    messageSpeech = messageText;

    updateMessage();

}



/* =========================================================
   CLEAR
========================================================= */

function clearMessage() {

    clickSound();

    messageText = "";
    messageSpeech = "";

    updateMessage();

}



/* =========================================================
   SPEAK MESSAGE
========================================================= */

function speakMessage() {

    clickSound();


    if (!messageText.trim()) {

        return;

    }


    speak(messageText);

}



/* =========================================================
   REPEAT MESSAGE
========================================================= */

function repeatMessage() {

    clickSound();


    if (lastSpoken) {

        speak(lastSpoken);

    }

}



/* =========================================================
   POPUP
========================================================= */

function showPopup() {

    if (!messageText.trim()) {

        return;

    }


    clickSound();


    document.getElementById(
        "popupText"
    ).textContent =
        messageText;


    document.getElementById(
        "popup"
    ).style.display =
        "block";

}



function closePopup() {

    clickSound();


    document.getElementById(
        "popup"
    ).style.display =
        "none";

}



/* =========================================================
   PHYSICAL KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key;


        if (
            /^[a-zA-Z]$/.test(key)
        ) {

            addLetter(
                key.toUpperCase()
            );

            return;

        }


        if (key === " ") {

            addSpace();

            return;

        }


        if (key === "Backspace") {

            deleteLetter();

            return;

        }


        if (key === "Escape") {

            clearMessage();

            return;

        }


        if (key === "Enter") {

            speakMessage();

            return;

        }

    }
);



/* =========================================================
   START
========================================================= */

createCommunicationButtons();

displayKeyboard();

updateMessage();

/* =========================================================
   IPAD-FRIENDLY TOUCH HANDLING
   Run the existing action directly from the real touch event.
   This preserves iPad/iPhone user activation for speech audio.
========================================================= */

(function enableIPadTouch() {
    let lastTouchTarget = null;
    let lastTouchTime = 0;

    function findControl(target) {
        if (!target || !target.closest) return null;
        const control = target.closest("button, #message");
        if (!control || control.disabled) return null;
        return control;
    }

    function activate(control) {
        if (control.id === "message") {
            clickSound();
            const textToSpeak = messageSpeech || messageText;
            if (textToSpeak && textToSpeak.trim()) {
                speak(textToSpeak);
            }
            return;
        }

        // Call the button's existing action directly during the real touch.
        if (typeof control.onclick === "function") {
            control.onclick.call(control);
        }
    }

    // iOS Safari: touchstart is a trusted user gesture, unlike a scripted click.
    document.addEventListener("touchstart", function(event) {
        const touch = event.changedTouches && event.changedTouches[0];
        if (!touch) return;

        const control = findControl(touch.target);
        if (!control) return;

        lastTouchTarget = control;
        lastTouchTime = Date.now();

        // Activate immediately; the user does not need to release quickly.
        activate(control);

        // Prevent Safari generating a second click after the touch.
        event.preventDefault();
    }, { capture: true, passive: false });

    // Keep mouse/trackpad use working on desktop.
    document.addEventListener("pointerdown", function(event) {
        if (event.pointerType === "touch") return;
        if (event.pointerType === "mouse" && event.button !== 0) return;

        const control = findControl(event.target);
        if (!control) return;

        activate(control);
        event.preventDefault();
    }, { capture: true, passive: false });

    // Suppress only the delayed synthetic click that follows our handled touch.
    document.addEventListener("click", function(event) {
        const control = findControl(event.target);
        if (
            event.detail > 0 &&
            control &&
            control === lastTouchTarget &&
            Date.now() - lastTouchTime < 1200
        ) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }
    }, true);

    document.addEventListener("contextmenu", function(event) {
        if (findControl(event.target)) event.preventDefault();
    }, true);
})();
