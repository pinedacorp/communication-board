<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Communication Board</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 10px;

    background: #eeeeee;

    font-family: Arial, Helvetica, sans-serif;

    text-align: center;

    user-select: none;
}


/* =========================================================
   TITLE
========================================================= */

h1 {
    font-size: clamp(30px, 6vw, 52px);

    margin: 5px 0 10px;

    font-weight: bold;
}


/* =========================================================
   MESSAGE DISPLAY
========================================================= */

#message {

    background: white;

    border: 5px solid #333;

    border-radius: 18px;

    min-height: 110px;

    padding: 15px;

    margin-bottom: 15px;

    font-size: clamp(32px, 7vw, 64px);

    font-weight: bold;

    display: flex;

    align-items: center;

    justify-content: center;

    word-break: break-word;
}


/* =========================================================
   COMMUNICATION BUTTONS
========================================================= */

.button-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-bottom: 15px;
}


button {

    border: 4px solid #222;

    border-radius: 18px;

    min-height: 95px;

    padding: 8px;

    font-size:
        clamp(25px, 5vw, 42px);

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;

    box-shadow:
        0 4px 0 #555;

    transition:
        transform 0.05s;
}


button:active {

    transform:
        translateY(4px);

    box-shadow: none;
}


/* =========================================================
   DIFFERENT BUTTON COLOURS
========================================================= */

.button-yes {
    background: #8BE28B;
}

.button-no {
    background: #FF9999;
}

.button-positive {
    background: #FFD966;
}

.button-condition {
    background: #C9B1FF;
}

.button-body {
    background: #FFB6C1;
}

.button-needs {
    background: #87CEEB;
}

.button-help {
    background: #FFB347;
}

.button-other {
    background: #B8E986;
}


/* =========================================================
   KEYBOARD
========================================================= */

#keyboard {

    margin-top: 20px;
}


#keyboardTitle {

    font-size:
        clamp(28px, 5vw, 42px);

    font-weight: bold;

    margin-bottom: 10px;
}


.keyboard-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}


.letter {

    min-height: 110px;

    font-size:
        clamp(45px, 9vw, 80px);

    background: #FFFFFF;
}


/* =========================================================
   KEYBOARD CONTROL BUTTONS
========================================================= */

.keyboard-controls {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 10px;
}


.control {

    min-height: 90px;

    font-size:
        clamp(28px, 5vw, 44px);
}


.delete {

    background: #FF9999;
}


.clear {

    background: #FFCC80;
}


.space {

    grid-column:
        span 2;

    background: #D0E0FF;
}


.speak {

    background: #8BE28B;
}


.repeat {

    background: #C9B1FF;

    width: 100%;

    margin-top: 10px;
}


/* =========================================================
   PAGE BUTTONS
========================================================= */

.page-controls {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 10px;
}


.page-button {

    min-height: 80px;

    font-size:
        clamp(26px, 5vw, 40px);

    background: #D9D9D9;
}


/* =========================================================
   POPUP
========================================================= */

#popup {

    display: none;

    position: fixed;

    left: 5%;

    right: 5%;

    top: 25%;

    background: white;

    border: 6px solid #222;

    border-radius: 20px;

    padding: 25px;

    font-size:
        clamp(35px, 7vw, 65px);

    font-weight: bold;

    z-index: 9999;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.4);
}


#popupClose {

    margin-top: 20px;

    min-height: 80px;

    font-size: 32px;

    background: #DDD;
}


/* =========================================================
   TABLETS / LARGE SCREENS
========================================================= */

@media (min-width: 700px) {

    body {
        padding: 20px;
    }


    .button-grid {

        grid-template-columns:
            repeat(4, 1fr);
    }


    .keyboard-grid {

        grid-template-columns:
            repeat(4, 1fr);
    }


    .letter {

        min-height: 130px;
    }

}

</style>

</head>


<body>


<h1>Communication</h1>


<!-- =====================================================
     COMMUNICATION BUTTONS
====================================================== -->

<div
    class="button-grid"
    id="communicationButtons">
</div>


<!-- =====================================================
     MESSAGE DISPLAY (Moved down just above the keyboard)
====================================================== -->

<div id="message">

    Tap a button or type a message

</div>


<!-- =====================================================
     KEYBOARD
====================================================== -->

<div id="keyboard">

    <div id="keyboardTitle">
        KEYBOARD A–M
    </div>


    <div
        class="keyboard-grid"
        id="letters">
    </div>


    <div class="keyboard-controls">

        <button
            class="control delete"
            onclick="deleteLetter()">

            DELETE

        </button>


        <button
            class="control clear"
            onclick="clearMessage()">

            CLEAR

        </button>


        <button
            class="control space"
            onclick="addSpace()">

            SPACE

        </button>


        <button
            class="control speak"
            onclick="speakMessage()">

            🔊 SPEAK

        </button>

    </div>


    <button
        class="control repeat"
        onclick="repeatMessage()">

        🔊 REPEAT MESSAGE

    </button>


    <div class="page-controls">

        <button
            class="page-button"
            onclick="previousKeyboard()">

            ◀ PREVIOUS

        </button>


        <button
            class="page-button"
            onclick="nextKeyboard()">

            NEXT ▶

        </button>

    </div>

</div>


<!-- =====================================================
     POPUP
====================================================== -->

<div id="popup">

    <div id="popupText"></div>


    <button
        id="popupClose"
        onclick="closePopup()">

        CLOSE

    </button>

</div>



<script>


/* =========================================================
   =========================================================

   ⭐⭐ EASY EDIT SECTION ⭐⭐

   THIS IS THE MAIN PART YOU WILL EDIT.

   "text"  = what appears on the button

   "speech" = what the device says

   "colour" = colour of the button

   =========================================================
   ========================================================= */

const communicationButtons = [

    /*
    ---------------------------------------------------------
    YES
    ---------------------------------------------------------
    */

    {
        text: "WA",
        speech: "wah",
        colour: "button-yes"
    },


    /*
    ---------------------------------------------------------
    NO
    ---------------------------------------------------------
    */

    {
        text: "ALI",
        speech: "ah-LEE",
        colour: "button-no"
    }
];

// Placeholder helper functions to prevent code errors before your layout engine functions load
function deleteLetter() { console.log("Delete clicked"); }
function clearMessage() { console.log("Clear clicked"); }
function addSpace() { console.log("Space clicked"); }
function speakMessage() { console.log("Speak clicked"); }
function repeatMessage() { console.log("Repeat clicked"); }
function previousKeyboard() { console.log("Previous clicked"); }
function nextKeyboard() { console.log("Next clicked"); }
function closePopup() { console.log("Close popup clicked"); }

</script>

</body>
</html>
