<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <title>Communication Board</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      padding: 12px;
      min-height: 100vh;
    }


    /* =====================================================
       MAIN TITLE
       ===================================================== */

    h1 {
      text-align: center;
      color: #ffffff;
      background: #333333;

      font-size: 30px;
      font-weight: bold;

      border-radius: 16px;

      padding: 16px;
      margin-bottom: 16px;

      letter-spacing: 1px;
    }


    /* =====================================================
       COMMUNICATION BUTTONS
       ===================================================== */

    .category {
      margin-bottom: 18px;
    }


    .cat-label {
      font-size: 20px;
      font-weight: bold;

      color: #eeeeee;

      text-transform: uppercase;
      letter-spacing: 2px;

      margin-bottom: 8px;
      padding-left: 4px;
    }


    .btn-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

      gap: 12px;
    }


    .btn {
      border: none;

      border-radius: 18px;

      padding: 20px 10px;

      font-size: 28px;
      font-weight: bold;

      cursor: pointer;

      line-height: 1.1;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 120px;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      color: #ffffff;

      transition:
        transform 0.1s,
        opacity 0.1s;
    }


    .btn:active {
      transform: scale(0.94);
      opacity: 0.8;
    }


    .btn .icon {
      font-size: 44px;
      line-height: 1;
    }


    /* YES / NO */

    .btn-yes {
      background: #16804f;
    }

    .btn-no {
      background: #c43d20;
    }


    /* FEELING */

    .btn-good {
      background: #2e720d;
    }

    .btn-bad {
      background: #8f2020;
    }

    .btn-tired {
      background: #4a2e8a;
    }

    .btn-ok {
      background: #0d604b;
    }


    /* BODY */

    .btn-pain {
      background: #7a1818;
    }

    .btn-itchy {
      background: #87500b;
    }

    .btn-cold {
      background: #0a3d7a;
    }

    .btn-hot {
      background: #993418;
    }


    /* NEEDS */

    .btn-hungry {
      background: #a86010;
    }

    .btn-thirsty {
      background: #1058a0;
    }

    .btn-toilet {
      background: #245210;
    }

    .btn-medicine {
      background: #322f80;
    }


    /* HELP */

    .btn-help {
      background: #b01030;

      min-height: 140px;

      font-size: 34px;
    }

    .btn-more {
      background: #444444;
    }

    .btn-stop {
      background: #8f1818;
    }


    /* =====================================================
       KEYBOARD SECTION
       ===================================================== */

    .keyboard-section {

      margin-top: 28px;

      background: #222222;

      border: 4px solid #555555;

      border-radius: 22px;

      padding: 14px;

      margin-bottom: 20px;
    }


    .keyboard-title {

      text-align: center;

      color: #ffffff;

      font-size: 32px;

      font-weight: bold;

      margin-bottom: 12px;
    }


    /* =====================================================
       LARGE MESSAGE DISPLAY
       ===================================================== */

    .typed-text {

      width: 100%;

      min-height: 120px;

      background: #ffffff;

      color: #111111;

      border: 5px solid #777777;

      border-radius: 18px;

      padding: 20px;

      font-size: 44px;

      font-weight: bold;

      line-height: 1.2;

      margin-bottom: 16px;

      overflow-wrap: break-word;

      word-break: break-word;

    }


    /* =====================================================
       KEYBOARD PAGE CONTROLS
       ===================================================== */

    .keyboard-page {

      display: none;
    }


    .keyboard-page.active {

      display: block;
    }


    .page-indicator {

      text-align: center;

      color: #ffffff;

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 12px;
    }


    /* =====================================================
       MASSIVE LETTER KEYS
       ===================================================== */

    .letter-grid {

      display: grid;

        repeat(3, 1fr);

    .letter-key {

      width: 100%;

      color: #111111;

      border: 5px solid #777777;

      align-items: center;

      touch-action: manipulation;

      box-shadow: 0 5px 0 #555555;

    }


    .letter-key:active {

      transform: translateY(5px);

      background: #dddddd;

      box-shadow: none;

    }


    /* =====================================================
       KEYBOARD NAVIGATION
       ===================================================== */

    .keyboard-navigation {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      margin-top: 14px;
    }


    .nav-key {

      min-height: 90px;

      border-radius: 18px;

      font-size: 30px;

      font-weight: bold;

      color: #ffffff;

      cursor: pointer;

      touch-action: manipulation;

    }


    .previous-key {

      background: #555555;
    }


    .next-key {

      background: #555555;
    }


    .nav-key:active {

      transform: scale(0.96);
    }


    /* =====================================================
       SPECIAL KEYBOARD BUTTONS
       ===================================================== */

    .special-buttons {

      display: grid;

      grid-template-columns:
        1fr 1.5fr 1fr 1.3fr;

      gap: 10px;

      margin-top: 14px;
    }


    .special-key {

      min-height: 95px;

      border: none;

      border-radius: 18px;

      font-size: 26px;

      color: #ffffff;

      line-height: 1.1;
    }

    }


    .space-key {

      background: #555555;
    }


    .clear-key {

      background: #a51d1d;
    }


    .speak-key {

      background: #16804f;

      font-size: 30px;
    }


    .special-key:active {

      transform: scale(0.96);
    }


    /* =====================================================
       REPEAT BUTTON
       ===================================================== */

    .repeat-button {

      width: 100%;

      min-height: 90px;

      margin-top: 12px;

      border: none;

      border-radius: 18px;

      background: #185fa5;

      color: #ffffff;

      font-size: 30px;

      font-weight: bold;

      cursor: pointer;

      touch-action: manipulation;
    }


    .repeat-button:active {

      transform: scale(0.97);
    }


    /* =====================================================
       LARGE POPUP
       ===================================================== */

    .flash-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.80);

      display: none;

      z-index: 998;
    }


    .flash-msg {

      position: fixed;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      background: #ffffff;

      color: #111111;

      font-size: 58px;

      font-weight: bold;

      border-radius: 24px;

      z-index: 999;

      text-align: center;

      overflow-wrap: break-word;
    }


    /* =====================================================
       TABLET / LARGE SCREEN
       ===================================================== */

    @media (min-width: 900px) {

      .letter-grid {

        grid-template-columns:
          repeat(4, 1fr);

      }

        height: 145px;

      }

      }

       PHONE

      }


      .speak-key {

        grid-column:

      }


      .special-key {

        min-height: 80px;

        font-size: 22px;

      }


      .keyboard-title {

        font-size: 27px;

      }

    }

  </style>

</head>

  <!-- =====================================================
       JAVASCRIPT

  <script>


    /* =====================================================
       VARIABLES
       ===================================================== */

    var flashTimer;

    var typedMessage = "";


    /* =====================================================
       COMMUNICATION BUTTON POPUP
       ===================================================== */

    function flash(icon, word) {

      var msg =
        document.getElementById(
          "flashMsg"
        );

      var overlay =
        document.getElementById(
          "overlay"
        );


      msg.innerHTML =
        '<span style="font-size:70px;">' +
        icon +
        '</span>' +
        '<br>' +
        word;


      msg.style.display = "block";

      overlay.style.display = "block";


      clearTimeout(flashTimer);


      flashTimer =
        setTimeout(
          hideFlash,
          3000
        );

    }


    /* =====================================================
       HIDE POPUP
       ===================================================== */

    function hideFlash() {

      document.getElementById(
        "flashMsg"
      ).style.display = "none";


      document.getElementById(
        "overlay"
      ).style.display = "none";


      clearTimeout(flashTimer);

    }


    /* =====================================================
       UPDATE MESSAGE
       ===================================================== */

    function updateTypedText() {

      var display =
        document.getElementById(
          "typedText"
        );


      if (typedMessage.length === 0) {

        display.innerText =
          "TAP A LETTER BELOW...";

      } else {

        display.innerText =
          typedMessage;

      }

    }


    /* =====================================================
       ADD LETTER
       ===================================================== */

    function typeLetter(letter) {

      typedMessage += letter;

      updateTypedText();

    }


    /* =====================================================
       SPACE
       ===================================================== */

    function typeSpace() {

      if (
        typedMessage.length > 0 &&
        !typedMessage.endsWith(" ")
      ) {

        typedMessage += " ";

        updateTypedText();

      }

    }


    /* =====================================================
       DELETE
       ===================================================== */

    function backspace() {

      if (
        typedMessage.length > 0
      ) {

        typedMessage =
          typedMessage.substring(
            0,
            typedMessage.length - 1
          );

        updateTypedText();

      }

    }


    /* =====================================================
       CLEAR
       ===================================================== */

    function clearText() {

      typedMessage = "";

      updateTypedText();

    }


    /* =====================================================
       SWITCH KEYBOARD
       ===================================================== */

    function showKeyboard(page) {

      var page1 =
        document.getElementById(
          "keyboardPage1"
        );

      var page2 =
        document.getElementById(
          "keyboardPage2"
        );


      page1.classList.remove("active");

      page2.classList.remove("active");


      if (page === 1) {

        page1.classList.add("active");

      } else {

        page2.classList.add("active");

      }

    }


    /* =====================================================
       SPEAK MESSAGE
       ===================================================== */

    function speakMessage() {

      if (
        typedMessage.trim() === ""
      ) {

        flash(
          "🔊",
          "PLEASE TYPE A MESSAGE"
        );

        return;

      }


      /*
       * Stop anything currently being spoken.
       */

      window.speechSynthesis.cancel();


      /*
       * Create speech.
       */

      var speech =
        new SpeechSynthesisUtterance(
          typedMessage
        );


      /*
       * English voice.
       */

      speech.lang = "en-GB";


      /*
       * Slightly slower speech.
       * This is intentional for an elderly
       * listener.
       */

      speech.rate = 0.85;


      /*
       * Normal pitch.
       */

      speech.pitch = 1;


      /*
       * Speak.
       */

      window.speechSynthesis.speak(
        speech
      );


      /*
       * Also show the message
       * visually.
       */

      showMessagePopup();

    }


    /* =====================================================
       SHOW TYPED MESSAGE
       ===================================================== */

    function showMessagePopup() {

      var msg =
        document.getElementById(
          "flashMsg"
        );

      var overlay =
        document.getElementById(
          "overlay"
        );


      msg.innerHTML =
        '<div style="' +
        'font-size:30px;' +
        'margin-bottom:20px;">' +
        'MESSAGE' +
        '</div>' +

        '<div style="' +
        'font-size:60px;' +
        'line-height:1.2;">' +

        typedMessage +

        '</div>' +

        '<div style="' +
        'font-size:26px;' +
        'margin-top:25px;' +
        'color:#555;">' +

        '🔊 SPEAKING...' +

        '</div>';


      msg.style.display =
        "block";


      overlay.style.display =
        "block";


      clearTimeout(flashTimer);


      flashTimer =
        setTimeout(
          hideFlash,
          6000
        );

    }


    /* =====================================================
       PHYSICAL KEYBOARD SUPPORT
       ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        var key = event.key;


        /*
         * A-Z
         */

        if (
          /^[a-zA-Z]$/.test(key)
        ) {

          typeLetter(
            key.toUpperCase()
          );

          event.preventDefault();

        }


        /*
         * SPACE
         */

        else if (
          key === " "
        ) {

          typeSpace();

          event.preventDefault();

        }


        /*
         * BACKSPACE
         */

        else if (
          key === "Backspace"
        ) {

          backspace();

          event.preventDefault();

        }


        /*
         * ESCAPE = CLEAR
         */

        else if (
          key === "Escape"
        ) {

          clearText();

          event.preventDefault();

        }


        /*
         * ENTER = SPEAK
         */

        else if (
          key === "Enter"
        ) {

          speakMessage();

          event.preventDefault();

        }

      }
    );


  </script>


</body>

</html>
